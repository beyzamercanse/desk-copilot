[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-copilot"
version = "0.1.0"
description = "AI analyst agent for trading data: governed text-to-SQL over dbt marts plus RAG over power-market outage notices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hera Beyza Mercan" }]
dependencies = [
  "pyyaml>=6",
  "sqlglot>=25",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2",
  "anthropic>=0.40",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "sentence-transformers>=3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "entsoe-py>=0.6",
  "pandas>=2.1",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
